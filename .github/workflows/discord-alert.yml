name: Discord Message Monitor
on:
  schedule:
    # Runs every hour
    - cron: "0 * * * *"  # Every hour at :00
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm install discord.js dotenv
        
      - name: Run Discord alert bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          PROJECT_MGMT_CHANNEL_ID: ${{ secrets.PROJECT_MGMT_CHANNEL_ID }}
          MANAGER_ROLE_ID: ${{ secrets.MANAGER_ROLE_ID }}
        run: node index.js
        
      - name: Commit updated db.json
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add db.json
          git diff --staged --quiet || git commit -m "Update db.json [skip ci]"
          git push